<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>McAfee Cookbook</title>
<meta name="theme-color" content="#111111" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Cookbook" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:#f4f4f5; --surface:#ffffff; --surface-2:#fafafa; --border:#e4e4e7;
  --text:#111111; --muted:#5f5f66; --faint:#9a9aa1;
  --ink:#111111; --ink-text:#ffffff; --ink-muted:#a9a9b0; --ink-hover:rgba(255,255,255,.09);
  --accent:#111111; --accent-text:#ffffff; --chip:#efeff1; --chip-hover:#e4e4e7;
  --green:#3B6D11; --green-light:#EAF3DE; --red:#c0392b; --red-light:#fbeaea;
  --amber:#b7791f; --amber-light:#fdf3e1; --blue:#185FA5; --blue-light:#E6F1FB;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.06);
  --shadow-lg:0 24px 64px rgba(0,0,0,.28);
  --sb-w:248px; --top-h:64px; --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom, 0px); --safe-t:env(safe-area-inset-top, 0px);
  color-scheme: light;
}
html[data-theme="dark"] {
  --bg:#161625; --surface:#1e1e32; --surface-2:#25253c; --border:rgba(255,255,255,.1);
  --text:#e4e4ec; --muted:#9494ae; --faint:#5e5e78;
  --ink:#10101c; --ink-text:#e4e4ec; --ink-muted:#8a8aa6; --ink-hover:rgba(255,255,255,.07);
  --accent:#b0a8f4; --accent-text:#161625; --chip:#2a2745; --chip-hover:#34305a;
  --green:#6dcc6d; --green-light:#1a3319; --red:#ff7b6e; --red-light:#3a1d22;
  --amber:#f5c26b; --amber-light:#3a2f17; --blue:#82b8f0; --blue-light:#19284a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html, body { background:var(--bg); }
body { font-family:'Inter', system-ui, -apple-system, sans-serif; color:var(--text); font-size:15px; line-height:1.45; min-height:100vh; -webkit-font-smoothing:antialiased; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; background:none; border:none; }
a { color:inherit; }
img { display:block; max-width:100%; }
svg.i { width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
svg.i.sm { width:16px; height:16px; }
svg.i.lg { width:24px; height:24px; }
svg.i.fill { fill:currentColor; }
.hide { display:none !important; }
.muted { color:var(--muted); } .faint { color:var(--faint); }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* ── Gate (connect + PIN) — same feel as the dashboard PIN screen ── */
.gate { position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; padding:16px;
  background:linear-gradient(135deg, #1a1a2e 0%, #2b2b45 55%, #3a3a3a 100%); }
.gate-card { background:#fff; color:#111; border-radius:20px; padding:28px 24px; width:100%; max-width:340px; text-align:center; box-shadow:var(--shadow-lg); }
.gate-logo { width:64px; height:64px; margin:0 auto 12px; border-radius:16px; background:#111; color:#fff; display:flex; align-items:center; justify-content:center; }
.gate-logo svg { width:34px; height:34px; }
.gate h1 { font-size:20px; font-weight:700; margin-bottom:4px; }
.gate p { font-size:14px; color:#5f5f66; margin-bottom:18px; }
.gate input { width:100%; border:1px solid #e4e4e7; border-radius:12px; padding:12px 14px; font-size:16px; background:#fafafa; margin-bottom:10px; }
.gate .link-btn { margin-top:14px; font-size:14px; color:#5f5f66; text-decoration:underline; }
.pin-dots { display:flex; justify-content:center; gap:12px; margin-bottom:20px; }
.pin-dot { width:14px; height:14px; border-radius:50%; border:2px solid #111; transition:background .15s; }
.pin-dot.on { background:#111; }
.pin-pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.pin-btn { padding:14px; border-radius:12px; border:1px solid #e4e4e7; background:#f4f4f5; font-size:19px; font-weight:600; color:#111; }
.pin-btn:active { transform:scale(.95); background:#e4e4e7; }
.pin-btn.alt { font-size:14px; color:#5f5f66; }
.pin-err { color:var(--red); font-size:14px; min-height:20px; margin-top:12px; }
.gate-card.shake { animation:shake .35s; }
@keyframes shake { 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

/* ── Shell ── */
.sidebar { position:fixed; top:0; bottom:0; left:0; width:var(--sb-w); background:var(--ink); color:var(--ink-text); display:flex; flex-direction:column; z-index:50; padding:calc(16px + var(--safe-t)) 12px 16px; transition:transform .25s ease; }
.sb-head { display:flex; align-items:center; gap:10px; padding:4px 8px 18px; }
.sb-logo { width:36px; height:36px; border-radius:10px; background:#fff; color:#111; display:flex; align-items:center; justify-content:center; flex:none; }
.sb-head b { font-size:16px; font-weight:700; display:block; line-height:1.15; }
.sb-head small { font-size:12px; color:var(--ink-muted); }
.sb-close { margin-left:auto; color:var(--ink-muted); padding:6px; display:none; }
.sb-add { display:flex; align-items:center; justify-content:center; gap:8px; background:#fff; color:#111; border-radius:999px; padding:11px 14px; font-weight:600; margin:0 4px 16px; }
.sb-add:hover { background:#e9e9ec; }
.sb-link { display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:999px; color:var(--ink-muted); text-decoration:none; font-weight:500; margin-bottom:2px; width:100%; text-align:left; }
.sb-link:hover { background:var(--ink-hover); color:var(--ink-text); }
.sb-link.active { background:#fff; color:#111; }
html[data-theme="dark"] .sb-link.active, html[data-theme="dark"] .sb-add { background:var(--accent); color:var(--accent-text); }
.sb-link .count { margin-left:auto; font-size:12px; opacity:.7; }
.sb-sep { height:1px; background:rgba(255,255,255,.1); margin:12px 8px; }
.sb-foot { margin-top:auto; display:flex; flex-direction:column; gap:2px; }
.sb-foot .sb-link { font-size:14px; padding:8px 14px; }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:45; opacity:0; pointer-events:none; transition:opacity .2s; }
.overlay.on { opacity:1; pointer-events:auto; }

.main { margin-left:var(--sb-w); min-height:100vh; display:flex; flex-direction:column; }
.topbar { position:sticky; top:0; z-index:30; background:var(--ink); color:var(--ink-text); padding:calc(10px + var(--safe-t)) 24px 10px; min-height:var(--top-h); display:flex; align-items:center; gap:12px; box-shadow:0 6px 20px rgba(0,0,0,.18); }
.topbar h1 { font-size:18px; font-weight:700; line-height:1.2; }
.topbar p { font-size:13px; color:var(--ink-muted); }
.tb-btn { width:40px; height:40px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; color:var(--ink-text); background:rgba(255,255,255,.08); flex:none; }
.tb-btn:hover { background:rgba(255,255,255,.16); }
.tb-back { display:none; }
.tb-right { margin-left:auto; display:flex; align-items:center; gap:8px; }
.sync { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-muted); padding:6px 10px; border-radius:999px; background:rgba(255,255,255,.06); white-space:nowrap; }
.sync i { width:8px; height:8px; border-radius:50%; background:#5fbf5f; }
.sync.busy i { background:#f5a623; animation:pulse 1s infinite; }
.sync.off i { background:#e0604f; }
.sync.demo i { background:#8f86f0; }
@keyframes pulse { 50% { opacity:.3; } }
.content { flex:1; padding:24px; padding-bottom:calc(40px + var(--safe-b)); width:100%; max-width:1200px; margin:0 auto; }

.bottom-nav { display:none; position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--ink); padding:6px 4px calc(6px + var(--safe-b)); justify-content:space-around; }
.bn { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; font-weight:500; color:var(--ink-muted); text-decoration:none; padding:6px 0; min-height:48px; }
.bn.active { color:var(--ink-text); }
.bn-add { flex:none; width:52px; height:52px; margin:-4px 6px 0; border-radius:999px; background:#fff; color:#111; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,.35); }
html[data-theme="dark"] .bn-add { background:var(--accent); color:var(--accent-text); }

#build-tag { position:fixed; right:8px; bottom:6px; font-size:11px; color:var(--faint); z-index:20; pointer-events:none; }

/* ── Common pieces ── */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 18px; border-radius:999px; background:var(--chip); color:var(--text); font-weight:600; font-size:14px; white-space:nowrap; transition:background .12s, transform .05s; }
.btn:hover { background:var(--chip-hover); }
.btn:active { transform:scale(.98); }
.btn.pri { background:var(--accent); color:var(--accent-text); }
.btn.pri:hover { opacity:.9; }
.btn.ghost { background:transparent; }
.btn.ghost:hover { background:var(--chip); }
.btn.danger { color:var(--red); }
.btn.sm { min-height:36px; padding:0 14px; font-size:13px; }
.btn.icon { width:44px; padding:0; }
.btn.sm.icon { width:36px; }
.btn[disabled] { opacity:.5; pointer-events:none; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
.chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip { flex:none; display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 14px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:13px; font-weight:500; color:var(--muted); }
.chip:hover { color:var(--text); }
.chip.on { background:var(--accent); border-color:var(--accent); color:var(--accent-text); }
.tag { display:inline-flex; align-items:center; padding:2px 9px; border-radius:999px; background:var(--chip); font-size:12px; color:var(--muted); font-weight:500; }
.search { position:relative; flex:1; min-width:0; }
.search svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--faint); }
.search input { width:100%; height:46px; border-radius:999px; border:1px solid var(--border); background:var(--surface); padding:0 16px 0 44px; font-size:16px; box-shadow:var(--shadow); }
.search input:focus, .field input:focus, .field textarea:focus, .field select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
.toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
.toolbar select { height:46px; border-radius:999px; border:1px solid var(--border); background:var(--surface); padding:0 14px; box-shadow:var(--shadow); }
.section-h { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:24px 0 10px; }
.section-h h2 { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.empty { text-align:center; padding:48px 20px; color:var(--muted); }
.empty svg { width:44px; height:44px; color:var(--faint); margin:0 auto 12px; display:block; }
.empty h3 { color:var(--text); font-size:17px; margin-bottom:6px; }
.empty p { margin-bottom:16px; }
.field { display:block; margin-bottom:14px; }
.field > span { display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:6px; }
.field small { display:block; font-size:12px; color:var(--faint); margin-top:5px; }
.field input, .field textarea, .field select { width:100%; border:1px solid var(--border); background:var(--surface-2); border-radius:12px; padding:11px 13px; font-size:16px; }
.field textarea { resize:vertical; min-height:90px; line-height:1.5; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.row3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.callout { border-radius:12px; padding:12px 14px; font-size:14px; display:flex; gap:10px; align-items:flex-start; }
.callout.info { background:var(--blue-light); color:var(--blue); }
.callout.warn { background:var(--amber-light); color:var(--amber); }
.callout.ok { background:var(--green-light); color:var(--green); }
.callout.err { background:var(--red-light); color:var(--red); }
.callout svg { margin-top:1px; }

/* ── Recipes grid ── */
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:16px; }
.rcard { overflow:hidden; display:flex; flex-direction:column; text-decoration:none; cursor:pointer; transition:transform .12s, box-shadow .12s; position:relative; }
.rcard:hover { transform:translateY(-2px); box-shadow:0 2px 4px rgba(0,0,0,.05), 0 12px 28px rgba(0,0,0,.1); }
.rthumb { aspect-ratio:4/3; background:var(--chip); position:relative; overflow:hidden; }
.rthumb img { width:100%; height:100%; object-fit:cover; }
.ph { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:46px; font-weight:700; color:rgba(0,0,0,.28); }
html[data-theme="dark"] .ph { color:rgba(255,255,255,.35); }
.rbody { padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
.rbody h3 { font-size:15px; font-weight:600; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.rmeta { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted); align-items:center; }
.rmeta span { display:inline-flex; align-items:center; gap:4px; }
.fav-badge { position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:999px; background:rgba(255,255,255,.92); color:#111; display:flex; align-items:center; justify-content:center; }
.fav-badge svg { fill:#f5a623; stroke:#f5a623; }
.src-badge { position:absolute; left:10px; bottom:10px; background:rgba(17,17,17,.78); color:#fff; font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; display:inline-flex; align-items:center; gap:5px; }
.src-badge svg { width:13px; height:13px; }

/* ── Categories ── */
.cat-group { margin-bottom:12px; }
.cat-gh { font-size:12px; font-weight:600; color:var(--faint); margin:0 0 6px 2px; }
.cat-row { display:flex; gap:10px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:none; scroll-snap-type:x proximity; }
.cat-row::-webkit-scrollbar { display:none; }
.ctile { flex:none; width:150px; height:96px; border-radius:14px; padding:10px 12px; display:flex; flex-direction:column; justify-content:flex-end; text-decoration:none; color:var(--text); background-size:cover !important; background-position:center !important; box-shadow:var(--shadow); scroll-snap-align:start; transition:transform .12s; }
.ctile:hover { transform:translateY(-2px); }
.ctile b { font-size:14px; font-weight:700; line-height:1.2; }
.ctile small { font-size:12px; opacity:.75; }
.ctile.photo { color:#fff; }
.ctile.photo small { opacity:.9; }
.cat-chip { display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:999px; background:var(--accent); color:var(--accent-text); font-size:12.5px; font-weight:600; text-decoration:none; }
.cat-chip.add { background:transparent; color:var(--muted); border:1px dashed var(--border); font-weight:500; }
.cat-chip.add:hover { color:var(--text); border-color:var(--text); }
.pick-group { margin-bottom:12px; }
.pick-h { font-size:12px; font-weight:600; color:var(--faint); margin-bottom:6px; }
.pick-chips { display:flex; flex-wrap:wrap; gap:6px; }
.pchip { display:inline-flex; align-items:center; gap:5px; min-height:34px; padding:0 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-size:13.5px; font-weight:500; color:var(--muted); }
.pchip:hover { color:var(--text); border-color:var(--text); }
.pchip.on { background:var(--accent); border-color:var(--accent); color:var(--accent-text); }
.pchip.new { border-style:dashed; }
.pchip .sug { color:#d9a21b; display:inline-flex; }
.pchip.on .sug { color:#f5c26b; }
.bs-row { padding:12px 0; border-bottom:1px solid var(--border); }
.bs-row:last-child { border-bottom:none; }
.bs-row b { display:block; margin-bottom:8px; }
.sidebar nav { flex:1; min-height:0; overflow-y:auto; scrollbar-width:thin; margin:0 -4px; padding:0 4px; }
.sb-cats { margin-top:6px; }
.sb-grp { display:flex; align-items:center; justify-content:space-between; width:100%; padding:10px 14px 4px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-muted); }
.sb-grp:hover { color:var(--ink-text); }
.sb-grp svg { width:14px; height:14px; transition:transform .15s; }
.sb-grp[aria-expanded="false"] svg { transform:rotate(-90deg); }
.sb-link.sb-cat { padding:7px 14px 7px 22px; font-size:14px; }
.sb-foot { margin-top:8px; }

/* ── Yield + ingredient grid ── */
.row-y { display:grid; grid-template-columns:1.6fr 1fr 1fr; gap:12px; }
.yield-in { display:flex; gap:6px; }
.yield-in input:first-child { width:64px; flex:none; }
.ig { border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--surface-2); }
.ig-head, .ig-row { display:grid; grid-template-columns:28px 84px 110px minmax(0, 1fr) 36px; align-items:center; }
.ig-head { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); background:var(--surface); border-bottom:1px solid var(--border); }
.ig-head span { padding:7px 8px; }
.ig-row { border-bottom:1px solid var(--border); background:var(--surface); }
.ig-row:last-child { border-bottom:none; }
.ig-row input { border:none; border-left:1px solid var(--border); background:transparent; padding:10px 9px; font-size:16px; min-width:0; width:100%; height:44px; border-radius:0; }
.ig-row input:focus { outline:2px solid var(--accent); outline-offset:-2px; background:var(--surface-2); }
.ig-row.sec { grid-template-columns:28px minmax(0, 1fr) 36px; background:var(--chip); }
.ig-row.sec input { font-weight:700; }
.ig-drag { display:flex; align-items:center; justify-content:center; height:44px; color:var(--faint); cursor:grab; touch-action:none; }
.ig-drag svg { transform:rotate(90deg); }
.ig.dragging { user-select:none; cursor:grabbing; }
.ig-row.lift { background:var(--chip); box-shadow:inset 3px 0 0 var(--accent); }
.ig-x { height:44px; display:flex; align-items:center; justify-content:center; color:var(--faint); }
.ig-x:hover { color:var(--red); }
.ig-actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; align-items:center; }
.ig-text { width:100%; border:1px solid var(--border); background:var(--surface-2); border-radius:12px; padding:11px 13px; font-size:16px; min-height:200px; line-height:1.5; }

/* ── Recipe detail ── */
.detail-hero.nophoto { grid-template-columns:1fr; }
.detail-hero { display:grid; grid-template-columns:minmax(0, 1.1fr) minmax(0, 1fr); gap:24px; align-items:start; margin-bottom:22px; }
.hero-img { border-radius:var(--radius); overflow:hidden; aspect-ratio:4/3; background:var(--chip); box-shadow:var(--shadow); }
.hero-img img { width:100%; height:100%; object-fit:cover; }
.hero-info h2 { font-size:28px; line-height:1.15; font-weight:700; letter-spacing:-.01em; margin-bottom:8px; }
.hero-info .desc { color:var(--muted); margin-bottom:14px; }
.hero-tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
.facts { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.fact { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px 12px; min-width:84px; }
.fact small { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); font-weight:600; }
.fact b { font-size:14px; font-weight:600; }
.actions { display:flex; gap:8px; flex-wrap:wrap; }
.src-line { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); margin-bottom:10px; text-decoration:none; max-width:100%; }
.src-line span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
a.src-line:hover { color:var(--text); text-decoration:underline; }
.cols { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.35fr); gap:20px; align-items:start; }
.panel { padding:18px 18px 10px; }
.panel-h { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.panel-h h3 { font-size:17px; font-weight:700; }
.scale { display:inline-flex; background:var(--chip); border-radius:999px; padding:3px; }
.scale button { min-width:40px; height:30px; border-radius:999px; font-size:13px; font-weight:600; color:var(--muted); padding:0 8px; }
.scale button.on { background:var(--surface); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.12); }
.ing-sec, .step-sec { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 0 4px; }
.ing { display:flex; align-items:flex-start; gap:12px; padding:9px 0; border-bottom:1px solid var(--border); cursor:pointer; }
.ing:last-child { border-bottom:none; }
.tick { width:22px; height:22px; border-radius:50%; border:2px solid var(--border); flex:none; margin-top:1px; display:flex; align-items:center; justify-content:center; transition:all .12s; }
.tick svg { width:14px; height:14px; stroke-width:3; opacity:0; color:var(--accent-text); }
.done .tick { background:var(--accent); border-color:var(--accent); }

.ing.done .ing-t { color:var(--faint); text-decoration:line-through; }
.ing-t { flex:1; min-width:0; }

.ing-name { text-decoration:underline; text-decoration-color:var(--border); text-underline-offset:3px; text-decoration-thickness:2px; }

.ing-has { display:inline-flex; vertical-align:middle; margin-left:4px; color:var(--blue); }
.step { display:flex; gap:14px; padding:12px 0; border-bottom:1px solid var(--border); cursor:pointer; }
.step:last-child { border-bottom:none; }
.step-n { width:28px; height:28px; border-radius:50%; background:var(--chip); font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none; }
.step.done .step-n { background:var(--accent); color:var(--accent-text); }

.adjust-box { background:var(--amber-light); color:var(--text); border-radius:12px; padding:12px 14px; margin-bottom:16px; }

.adjust-box li { margin-left:18px; font-size:14px; margin-bottom:3px; }
.recipe-notes { white-space:pre-wrap; font-size:14px; color:var(--muted); padding:4px 0 10px; }

/* Cook log */
.composer { padding:14px; margin-bottom:14px; }

.seg button.on { background:var(--surface); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.12); }
.stars { display:inline-flex; gap:2px; }
.stars button { padding:4px; color:var(--faint); }

.log { position:relative; }
.log-item { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
.log-item:last-child { border-bottom:none; }
.log-ico { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; }
.log-ico svg { width:16px; height:16px; }
.t-note .log-ico { background:var(--blue-light); color:var(--blue); }

.log-body { flex:1; min-width:0; }

/* ── Ingredient + shopping lists ── */

.lrow { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border); cursor:pointer; min-height:56px; }

.lrow:hover { background:var(--surface-2); }
.lrow-main { flex:1; min-width:0; }

.lrow-main small { color:var(--muted); font-size:12.5px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lrow-side { color:var(--faint); font-size:13px; display:flex; align-items:center; gap:6px; flex:none; }
.cat-dot { width:10px; height:10px; border-radius:50%; flex:none; }
.shop-qty { font-weight:600; color:var(--text); font-size:14px; }
.shop.done .lrow-main b { text-decoration:line-through; color:var(--faint); }

.addbar { display:flex; gap:8px; margin-bottom:14px; }

.sheet { position:relative; background:var(--surface); color:var(--text); border-radius:20px; width:100%; max-width:560px; max-height:calc(100vh - 48px); display:flex; flex-direction:column; box-shadow:var(--shadow-lg); animation:pop .2s ease; }

.grab { display:none; }

.add-opts { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:6px; }

.thumbs { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }

.thumbs img { width:100%; height:100%; object-fit:cover; }

.drop { border:2px dashed var(--border); border-radius:14px; padding:22px; text-align:center; color:var(--muted); cursor:pointer; display:block; }

.spin { width:18px; height:18px; border-radius:50%; border:2.5px solid currentColor; border-right-color:transparent; animation:rot .7s linear infinite; display:inline-block; }

.busy-box { display:flex; align-items:center; gap:12px; padding:14px; border-radius:12px; background:var(--chip); font-weight:500; margin-top:12px; }

.photo-edit { display:flex; gap:14px; align-items:center; margin-bottom:14px; }

.photo-edit .pv img { width:100%; height:100%; object-fit:cover; }

.check-list label { display:flex; gap:12px; align-items:center; padding:10px 2px; border-bottom:1px solid var(--border); cursor:pointer; }
.check-list label:last-child { border-bottom:none; }
.check-list input { width:20px; height:20px; accent-color:var(--accent); flex:none; }
.check-list .have { margin-left:auto; font-size:12px; color:var(--green); font-weight:600; }
.diff { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.diff h4 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:6px; }
.diff ul { margin-left:18px; font-size:14px; }
.diff li { margin-bottom:4px; }
.diff .gone { color:var(--red); text-decoration:line-through; }
.diff .new { color:var(--green); font-weight:500; }
.used-in a { display:flex; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); text-decoration:none; }
.used-in a:last-child { border-bottom:none; }
.used-in small { color:var(--muted); display:block; font-size:12.5px; }

.sugg-list { position:absolute; left:0; right:0; top:100%; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); z-index:5; max-height:220px; overflow-y:auto; margin-top:4px; }

.sugg-list button:hover { background:var(--chip); }

.toast-wrap { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(24px + var(--safe-b)); z-index:500; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:max-content; max-width:calc(100vw - 32px); }
.toast { background:#111; color:#fff; padding:11px 16px; border-radius:999px; font-size:14px; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.25); animation:pop .2s; pointer-events:auto; display:flex; align-items:center; gap:10px; }
.toast.err { background:#a8322a; }
.toast button { color:#c9c3ff; font-weight:600; }
html[data-theme="dark"] .toast { background:#e4e4ec; color:#161625; }
html[data-theme="dark"] .toast button { color:#534AB7; }

.settings .card { padding:18px; margin-bottom:16px; }
.settings h3 { font-size:16px; margin-bottom:4px; }
.settings p { color:var(--muted); font-size:14px; margin-bottom:12px; }
.kv { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:14px; margin-bottom:12px; }

}

/* ═══════════════════════ Backend calls + offline outbox ═══════════════════════ */
let OUTBOX = ls('rb_outbox') || [];
let flushing = false, lastLoad = 0, offline = false;
function setSync(state, text) {
  const el = $('#sync'); if (!el) return;
  el.className = 'sync ' + (state || '');
  $('#sync-text').textContent = text;
}
function showSyncState() {
  if (CFG.demo) return setSync('demo', 'Demo');
  if (offline) return setSync('off', OUTBOX.length ? OUTBOX.length + ' waiting' : 'Offline');
  if (OUTBOX.length || flushing) return setSync('busy', 'Saving…');
  setSync('', 'Saved');
}

async function api(action, payload, opts) {
  if (CFG.demo) return Demo.call(action, payload || {});
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), (opts && opts.timeout) || 45000);
  let res;
  try {
    res = await fetch(CFG.url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, pin: CFG.pin }, payload || {})), signal: ctl.signal, redirect:'follow' });
  } catch (e) {
    const err = new Error(e.name === 'AbortError' ? 'Timed out' : 'No connection'); err.network = true; throw err;
  } finally { clearTimeout(t); }
  let data;
  try { data = await res.json(); } catch (e) { const err = new Error('The backend sent back something unexpected. Check the web app URL and that it is deployed for "Anyone".'); err.network = !res.ok; throw err; }
  if (!data.ok) { const err = new Error(data.error || 'Something went wrong'); err.code = data.code; throw err; }
  return data;
}

/** Queue a change so nothing is lost when offline. Every queued action is safe to repeat. */
function queue(action, payload) {
  if (action === 'shop_ops') {
    const last = OUTBOX[OUTBOX.length - 1];
    if (last && last.action === 'shop_ops' && !last.sending) { last.payload.ops.push(...payload.ops); ls('rb_outbox', OUTBOX); return flush(); }
  }
  OUTBOX.push({ id: uid('q'), action, payload, tries: 0 });
  ls('rb_outbox', OUTBOX);
  saveCache();
  flush();
}
async function flush() {
  if (flushing) return;
  flushing = true; showSyncState();
  try {
    while (OUTBOX.length) {
      const job = OUTBOX[0];
      job.sending = true;
      try {
        await api(job.action, job.payload);
        OUTBOX.shift(); offline = false;
      } catch (e) {
        job.sending = false;
        if (e.network) { offline = true; break; }
        if (e.code === 'pin') { lockApp(true); break; }
        job.tries = (job.tries || 0) + 1;
        if (job.tries >= 3) { OUTBOX.shift(); toast('A change couldn\'t be saved: ' + e.message, { err:true, ms:6000 }); }
        else break;
      }
      ls('rb_outbox', OUTBOX);
    }
  } finally {
    flushing = false; ls('rb_outbox', OUTBOX); showSyncState();
    if (offline && OUTBOX.length) setTimeout(flush, 20000);
  }
}
async function syncNow(quiet) {
  toggleMenu(false);
  await flush();
  if (OUTBOX.length) { if (!quiet) toast('Still offline — your changes are kept on this device.'); return; }
  setSync('busy', 'Syncing…');
  try {
    const d = await api('load');
    applyData(d); saveCache(); lastLoad = Date.now(); offline = false;
    seedCategories();
    render();
    if (!quiet) toast('Up to date');
  } catch (e) {
    if (e.code === 'pin') return lockApp(true);
    if (e.network) offline = true;
    if (!quiet || !S.loaded) toast(e.message, { err:true });
    if (!S.loaded) $('#view').innerHTML = `<div class="card empty">${icon('refresh')}<h3>Couldn't load your recipes</h3><p>${esc(e.message)}</p><button class="btn pri" onclick="syncNow()">Try again</button></div>`;
  }
  showSyncState();
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && $('#app:not(.hide)') && Date.now() - lastLoad > 60000) syncNow(true); });

/* Turn messy pasted text into a recipe without AI */
function localParse(text) {
  const lines = String(text).split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const r = { title:'', description:'', ingredients:[], steps:[], notes:'', tags:[] };
  let mode = '', notes = [];
  const isIngHead = s => /^(ingredients?|you('ll)? need|what you need)\b[:\s]*$/i.test(s);
  const isStepHead = s => /^(instructions?|directions?|method|steps?|preparation|how to make( it)?)\b[:\s]*$/i.test(s);
  const isNoteHead = s => /^(notes?|tips?)\b[:\s]*$/i.test(s);
  lines.forEach((l, i) => {
    if (i === 0 && !isIngHead(l) && !isStepHead(l)) { r.title = l.replace(/^#+\s*/, ''); return; }
    if (isIngHead(l)) { mode = 'i'; return; }
    if (isStepHead(l)) { mode = 's'; return; }
    if (isNoteHead(l)) { mode = 'n'; return; }
    const m = l.match(/^(serves|servings|yield|makes)[:\s]+(.+)/i);
    if (m) { r.servings = m[2]; return; }
    const t = l.match(/^(prep|cook|total)(?: time)?[:\s]+(.+)/i);
    if (t) { r[t[1].toLowerCase() + '_time'] = t[2]; return; }
    if (mode === 'i') { if (/:$/.test(l) && !QTY_RE.test(normFrac(l))) r.ingredients.push({ section: l.replace(/:$/, '') }); else r.ingredients.push(l); return; }
    if (mode === 's') { r.steps.push(l); return; }
    if (mode === 'n') { notes.push(l); return; }
    // No headings: guess by shape
    const p = normFrac(l.replace(/^[-–•*▢□◦●·]\s*/, ''));
    if (QTY_RE.test(p) && l.length < 90 && !/\.\s+\w/.test(l)) r.ingredients.push(l);
    else if (l.length > 40 || /^\d+[.)]/.test(l)) r.steps.push(l);
    else notes.push(l);
  });
  r.notes = notes.join('\n');
  if (!r.title) r.title = 'New recipe';
  return r;
}

/* ═══════════════════════ Recipe model helpers ═══════════════════════ */
function linesToIngredients(lines) {
  return (lines||[]).map(x => {
    if (x && typeof x === 'object' && x.section) return { section: String(x.section).trim() };
    const s = String(x||'').trim();
    if (!s) return null;
    const h = s.match(/^(?:#+\s*|—\s*)(.+?)(?:\s*—)?$/) || (/:$/.test(s) && !QTY_RE.test(normFrac(s)) && s.length < 50 ? [0, s.slice(0, -1)] : null);
    if (h) return { section: h[1].trim() };
    return parseLine(s);
  }).filter(Boolean);
}
function linesToSteps(lines) {
  return (lines||[]).map(x => {
    if (x && typeof x === 'object' && x.section) return { section: String(x.section).trim() };
    let s = String(x||'').trim();
    if (!s) return null;
    const h = s.match(/^(?:#+\s*|—\s*)(.+?)(?:\s*—)?$/);
    if (h) return { section: h[1].trim() };
    s = s.replace(/^(step\s*)?\d+\s*[.):\-]\s*/i, '');
    return s ? { text: s } : null;
  }).filter(Boolean);
}
function ingredientsToText(data) { return (data||[]).map(l => l.section ? '## ' + l.section : l.text).join('\n'); }
function stepsToText(data) { return (data||[]).map(s => s.section ? '## ' + s.section : s.text).join('\n'); }
function snapshot(r) {
  return { title:r.title, servings:r.servings, ingredients:(r.ingredients_data||[]).map(l => l.section ? '## ' + l.section : l.text), steps:(r.steps_data||[]).map(s => s.section ? '## ' + s.section : s.text), captured: today() };
}
function tagList(r) { return String(r.tags||'').split(',').map(s => s.trim()).filter(Boolean); }
function recipeUses(ingId) {
  const out = [];
  S.recipes.forEach(r => (r.ingredients_data||[]).forEach(l => { if (!l.section && String(l.ingredient_id) === String(ingId)) out.push({ recipe:r, line:l }); }));
  return out;
}
function findIngredient(name) {
  const k = ingKey(name);
  if (!k) return null;
  return S.ingredients.find(i => ingKey(i.name) === k || String(i.aliases||'').split(',').some(a => a.trim() && ingKey(a) === k)) || null;
}
/** Links each line to the ingredient database, creating entries for new ingredients. Returns the new entries. */
function linkIngredients(lines) {
  const created = [];
  lines.forEach(l => {
    if (l.section) return;
    const name = cleanItem(l.item);
    if (!name || name.length > 60) { l.ingredient_id = ''; return; }
    let ing = findIngredient(l.item) || created.find(c => ingKey(c.name) === ingKey(l.item));
    if (!ing) {

      created.push(ing);
    }
    l.ingredient_id = ing.id;
  });

}
/** Plain-English list of what changed between two versions of a recipe. */
function diffRecipe(a, b) {
  const ch = [];
  if (a.title !== b.title) ch.push(`Renamed "${a.title}" → "${b.title}"`);
  if ((a.servings||'') !== (b.servings||'')) ch.push(`Yield: ${a.servings || '—'} → ${b.servings || '—'}`);
  ['prep_time','cook_time','total_time'].forEach(k => { if ((a[k]||'') !== (b[k]||'')) ch.push(`${k.replace('_time','').replace(/^./, c => c.toUpperCase())} time: ${a[k] || '—'} → ${b[k] || '—'}`); });
  const A = (a.ingredients_data||[]).filter(l => !l.section), B = (b.ingredients_data||[]).filter(l => !l.section);
  const usedB = new Set();
  A.forEach(la => {
    if (B.some((lb, j) => !usedB.has(j) && lb.text === la.text && usedB.add(j))) return;
    const j = B.findIndex((lb, j) => !usedB.has(j) && ingKey(lb.item) && ingKey(lb.item) === ingKey(la.item));
    if (j > -1) { usedB.add(j); ch.push(`${cleanItem(B[j].item) || B[j].item}: ${la.text} → ${B[j].text}`); }
    else ch.push(`Removed: ${la.text}`);
  });
  B.forEach((lb, j) => { if (!usedB.has(j)) ch.push(`Added: ${lb.text}`); });
  const sa = (a.steps_data||[]).filter(s => !s.section).map(s => s.text), sb = (b.steps_data||[]).filter(s => !s.section).map(s => s.text);
  if (sa.join('\n') !== sb.join('\n')) {
    let changed = 0; const n = Math.max(sa.length, sb.length);
    const added = sb.filter(s => !sa.includes(s)), removed = sa.filter(s => !sb.includes(s));
    for (let i = 0; i < n; i++) if (sa[i] !== sb[i]) changed++;
    if (added.length === 1 && removed.length === 1) ch.push(`Step changed: "${removed[0]}" → "${added[0]}"`);
    else { if (added.length) ch.push(`Steps: ${added.length} added/rewritten`); if (removed.length > added.length) ch.push(`Steps: ${removed.length - added.length} removed`); if (!added.length && !removed.length && changed) ch.push('Steps reordered'); }
  }
  if ((a.notes||'') !== (b.notes||'')) ch.push('Recipe notes updated');
  if ((a.description||'') !== (b.description||'')) ch.push('Description updated');
  if ((a.photo||'') !== (b.photo||'')) ch.push(b.photo ? 'New photo' : 'Photo removed');
  return ch;
}
function isModified(r) {
  if (!r.original || !r.original.ingredients) return false;
  const cur = snapshot(r);
  return cur.ingredients.join('\n') !== r.original.ingredients.join('\n') || cur.steps.join('\n') !== r.original.steps.join('\n') || (cur.servings||'') !== (r.original.servings||'');
}

/* ═══════════════════════ Sheets (dialogs) ═══════════════════════ */
const sheets = [];
function openSheet(o) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet-bg"></div><div class="sheet ${o.lg ? 'lg' : ''}" role="dialog" aria-modal="true" aria-label="${esc(o.title)}">
    <div class="grab"></div>
    <div class="sheet-h"><h2>${esc(o.title)}</h2>${o.headExtra || ''}<button class="btn sm icon ghost" data-close aria-label="Close">${icon('x')}</button></div>
    <div class="sheet-b">${o.body || ''}</div>
    ${o.foot ? `<div class="sheet-f">${o.foot}</div>` : ''}</div>`;
  document.body.appendChild(wrap);
  document.body.style.overflow = 'hidden';
  const close = () => closeSheet(wrap);
  wrap.querySelector('.sheet-bg').onclick = () => { if (!o.sticky) close(); };
  wrap.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  wrap.close = close; wrap.onClose = o.onClose;
  sheets.push(wrap);
  hydrateIcons(wrap);
  const first = wrap.querySelector('[autofocus]');
  if (first && matchMedia('(min-width: 900px)').matches) setTimeout(() => first.focus(), 50);
  return wrap;
}
function closeSheet(w) {
  const i = sheets.indexOf(w); if (i > -1) sheets.splice(i, 1);
  w.remove();
  if (w.onClose) w.onClose();
  if (!sheets.length) document.body.style.overflow = '';
}
function closeAllSheets() { while (sheets.length) closeSheet(sheets[sheets.length - 1]); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheets.length) closeSheet(sheets[sheets.length - 1]); });
function confirmSheet(title, msg, okLabel, danger) {
  return new Promise(res => {
    let done = false;
    const w = openSheet({ title, body:`<p>${esc(msg)}</p>`, foot:`<button class="btn ghost" data-close>Cancel</button><button class="btn ${danger ? 'pri' : 'pri'}" id="cf-ok" style="${danger ? 'background:var(--red);color:#fff' : ''}">${esc(okLabel || 'OK')}</button>`, onClose: () => { if (!done) res(false); } });
    w.querySelector('#cf-ok').onclick = () => { done = true; res(true); w.close(); };
  });
}

const MEAT_RE = /\b(chicken|beef|pork|bacon|sausages?|turkey|ham|lamb|steaks?|shrimp|prawns?|salmon|tuna|fish|cod|tilapia|halibut|prosciutto|pancetta|chorizo|scallops?|crab|lobster|clams?|mussels|veal|anchov(y|ies)|gelatin|fish sauce|oyster sauce|lard|pepperoni|salami|meat|ground (beef|pork|turkey|chicken)|venison|duck|bison)\b/;
const seedKey = () => 'rb_cats_seeded_' + (CFG.demo ? 'demo' : CFG.url.slice(-24));
const hasCats = () => CFG.demo || S.features.includes('categories');
function catNames(r) { return String(r.categories || '').split(',').map(s => s.trim()).filter(Boolean); }
function catByName(n) { const k = String(n).trim().toLowerCase(); return S.categories.find(c => c.name.toLowerCase() === k); }
function recipeCats(r) { return catNames(r).map(catByName).filter(Boolean); }
function catCount(c) { const k = c.name.toLowerCase(); return S.recipes.filter(r => catNames(r).some(n => n.toLowerCase() === k)).length; }
function inCat(r, c) { const k = c.name.toLowerCase(); return catNames(r).some(n => n.toLowerCase() === k); }
/** Categories in display order, bunched by group: [[group, [cats…]], …] */
function catGroups(list) {
  list = (list || S.categories).slice().sort((a, b) => a.sort - b.sort || a.name.localeCompare(b.name));
  const order = [], map = {};
  list.forEach(c => { if (!map[c.group]) { map[c.group] = []; order.push(c.group); } map[c.group].push(c); });
  return order.map(g => [g, map[g]]);
}
function minutesOf(t) {
  t = String(t || '').toLowerCase(); if (!t) return 0;
  let m = 0, hit = false;
  t.replace(/(\d+(?:\.\d+)?)\s*(h|hr|hrs|hour|hours)\b/g, (_, n) => { m += parseFloat(n) * 60; hit = true; });
  t.replace(/(\d+)\s*(m|min|mins|minute|minutes)\b/g, (_, n) => { m += +n; hit = true; });
  if (!hit && /^\d+$/.test(t.trim())) m = +t;
  return m;
}
/** Which categories fit this recipe? Returns category names. */
function suggestCats(r) {
  const head = [r.title, Array.isArray(r.tags) ? r.tags.join(' ') : r.tags, r.description].join(' ').toLowerCase();
  const body = head + ' ' + [(r.steps_data || []).map(s => s.text || s.section || '').join(' '), r.notes].join(' ').toLowerCase();
  const items = (r.ingredients_data || []).filter(l => !l.section).map(l => String(l.item || '').toLowerCase()).join(' | ').replace(/vegetable (broth|stock)/g, 'veg');
  const out = new Set();
  const rules = Object.fromEntries(STARTER_CATS.map(([id, , , re, deep]) => [id, [re, deep]]));
  S.categories.forEach(c => {
    const rule = rules[c.id];
    if (rule && rule[0]) { if (rule[0].test(rule[1] ? body : head)) out.add(c.name); return; }
    if (rule) return;
    // Your own categories: suggested when their name shows up in the title, tags or description.
    const words = c.name.toLowerCase().replace(/&/g, ' ').split(/[^a-z0-9']+/).filter(w => w.length > 2);
    if (words.length && words.every(w => new RegExp('\\b' + w.replace(/s$/, '') + 's?\\b').test(head))) out.add(c.name);
  });
  const quick = S.categories.find(c => c.id === 'c-quick');
  if (quick) {
    const total = minutesOf(r.total_time) || (minutesOf(r.prep_time) + minutesOf(r.cook_time));
    if (total && total <= 30) out.add(quick.name);
  }
  const veg = S.categories.find(c => c.id === 'c-veg');
  if (veg && items && !MEAT_RE.test(items) && (r.ingredients_data || []).length >= 3) {
    const savory = ['c-dinner','c-lunch','c-soups','c-salads','c-pasta','c-casserole','c-sides','c-sandwich'].some(id => { const c = S.categories.find(x => x.id === id); return c && out.has(c.name); });
    if (savory) out.add(veg.name);
  }
  if (veg && MEAT_RE.test(items)) out.delete(veg.name);
  return Array.from(out);
}
function seedCategories() {
  if (!hasCats() || S.categories.length || ls(seedKey())) return;
  const items = STARTER_CATS.map(([id, name, group], i) => ({ id, name, group, sort: i * 10, created: nowIso() }));
  S.categories = items.map(c => ({ ...c }));
  ls(seedKey(), 1);
  queue('put_rows', { sheet:'Categories', items });
}
function saveCats(list) { if (list.length) queue('put_rows', { sheet:'Categories', items: list.map(c => ({ id:c.id, name:c.name, group:c.group, sort:c.sort, created:c.created || nowIso() })) }); }
/** Rename or remove a category name on every recipe that has it. */
function retagRecipes(oldName, newName) {
  const k = oldName.toLowerCase(); let n = 0;
  S.recipes.forEach(r => {
    const names = catNames(r);
    if (!names.some(x => x.toLowerCase() === k)) return;
    const next = names.map(x => x.toLowerCase() === k ? newName : x).filter(Boolean);
    r.categories = Array.from(new Set(next)).join(', ');
    queue('save_recipe', { recipe: Object.assign({}, r) }); n++;
  });
  return n;
}
function setRecipeCats(r, names) {
  const next = Array.from(new Set(names)).join(', ');
  if (next === r.categories) return false;
  r.categories = next;
  queue('save_recipe', { recipe: Object.assign({}, r) });
  return true;
}
function catHue(c) { return hashHue(c.name + c.group); }
function needsBackendNote() {
  return hasCats() ? '' : `<div class="callout warn" style="margin-bottom:14px">${icon('info','sm')}<div><b>Categories need the backend update.</b> Paste the new Code.gs into Apps Script, then Deploy → Manage deployments → ✏️ → New version → Deploy.</div></div>`;
}

/* Picker: grouped chips you tap on and off */
function catPickerHtml(selected, suggested) {
  const sel = new Set(Array.from(selected).map(s => s.toLowerCase()));
  const sug = new Set(Array.from(suggested || []).map(s => s.toLowerCase()));
  return catGroups().map(([g, cats]) => `<div class="pick-group"><div class="pick-h">${esc(g)}</div><div class="pick-chips">${cats.map(c => {
    const k = c.name.toLowerCase();
    return `<button type="button" class="pchip ${sel.has(k) ? 'on' : ''}" data-cat="${esc(c.name)}">${sel.has(k) ? icon('check','sm') : ''}${esc(c.name)}${sug.has(k) ? `<span class="sug" title="Suggested">${icon('sparkle','sm')}</span>` : ''}</button>`;
  }).join('')}</div></div>`).join('') + `<button type="button" class="pchip new" data-newcat>${icon('plus','sm')}New category</button>`;
}
function bindCatPicker(box, selected, suggested) {
  const draw = () => {
    box.innerHTML = catPickerHtml(selected, suggested);
    box.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
      const n = b.dataset.cat, k = n.toLowerCase();
      const have = Array.from(selected).find(x => x.toLowerCase() === k);
      if (have) selected.delete(have); else selected.add(n);
      draw();
    });
    box.querySelector('[data-newcat]').onclick = () => editCategory(null, null, c => { selected.add(c.name); draw(); });
  };
  draw();
  return draw;
}
function pickCategories(r) {
  const selected = new Set(recipeCats(r).map(c => c.name));
  const suggested = suggestCats(r);
  const w = openSheet({ title: 'Categories', body: `<p class="muted" style="margin-bottom:12px;font-size:14px">${esc(r.title)}${suggested.length ? ` · ${icon('sparkle','sm')} = suggested` : ''}</p><div id="pk"></div>`,
    foot: `<button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="pk-save">Save</button>` });
  bindCatPicker(w.querySelector('#pk'), selected, suggested);
  w.querySelector('#pk-save').onclick = () => { if (setRecipeCats(r, Array.from(selected))) toast('Categories saved'); w.close(); render(); };
}

/* Add / edit one category */
function editCategory(id, group, onSaved) {
  const c = id ? byId(S.categories, id) : null;
  const groups = catGroups().map(([g]) => g);
  const g0 = c ? c.group : (group || groups[0] || 'Meal');
  const w = openSheet({ title: c ? 'Edit category' : 'New category', body: `
    <label class="field"><span>Name</span><input id="ce-name" value="${esc(c ? c.name : '')}" placeholder="e.g. Sunday dinners" autofocus></label>
    <label class="field"><span>Group</span><select id="ce-group">${groups.map(g => `<option ${g === g0 ? 'selected' : ''}>${esc(g)}</option>`).join('')}<option value="__new">New group…</option></select></label>
    <label class="field hide" id="ce-ng-wrap"><span>New group name</span><input id="ce-ng" placeholder="e.g. Family favorites"></label>
    ${c ? `<p class="muted" style="font-size:14px">${catCount(c)} recipe${catCount(c) === 1 ? '' : 's'} in this category.</p>` : ''}`,
    foot: (c ? `<button class="btn ghost danger" id="ce-del">${icon('trash','sm')}Delete</button><span class="spacer"></span>` : '<button class="btn ghost" data-close>Cancel</button>') + `<button class="btn pri" id="ce-save">Save</button>` });
  const sel = w.querySelector('#ce-group');
  sel.onchange = () => w.querySelector('#ce-ng-wrap').classList.toggle('hide', sel.value !== '__new');
  if (!groups.length) { sel.value = '__new'; sel.onchange(); }
  w.querySelector('#ce-save').onclick = () => {
    const name = w.querySelector('#ce-name').value.trim().replace(/,/g, ' ');
    let grp = sel.value === '__new' ? w.querySelector('#ce-ng').value.trim() : sel.value;
    if (!name) return toast('Give it a name');
    if (!grp) return toast('Name the new group');
    const clash = catByName(name);
    if (clash && clash !== c) return toast('There\'s already a "' + clash.name + '" category');
    if (c) {
      const old = c.name;
      if (c.group !== grp) c.sort = Math.max(0, ...S.categories.filter(x => x.group === grp).map(x => x.sort)) + 10;
      c.name = name; c.group = grp; saveCats([c]);
      if (old !== name) { const n = retagRecipes(old, name); if (n) toast('Renamed on ' + n + ' recipe' + (n > 1 ? 's' : '')); }
      w.close(); render(); if (onSaved) onSaved(c); return;
    }
    const inGroup = S.categories.filter(x => x.group === grp);
    const sort = inGroup.length ? Math.max(...inGroup.map(x => x.sort)) + 1 : (Math.max(0, ...S.categories.map(x => x.sort)) + 1000);
    const nc = { id: uid('c'), name, group: grp, sort, created: nowIso() };
    S.categories.push(nc); saveCats([nc]);
    w.close(); render(); toast('Added ' + name); if (onSaved) onSaved(nc);
  };
  if (c) w.querySelector('#ce-del').onclick = async () => {
    const n = catCount(c);
    if (!await confirmSheet('Delete "' + c.name + '"?', n ? 'It comes off ' + n + ' recipe' + (n > 1 ? 's' : '') + '. The recipes themselves stay.' : 'No recipes use it.', 'Delete', true)) return;
    retagRecipes(c.name, null);
    S.categories = S.categories.filter(x => x !== c);
    queue('delete_rows', { sheet:'Categories', ids:[c.id] });
    closeAllSheets(); toast('Category deleted');
    if (route().name === 'cat') location.hash = '#categories'; else render();
  };
}

const SORTS = { new:(a, b) => String(b.created).localeCompare(String(a.created)), az:(a, b) => a.title.localeCompare(b.title), made:(a, b) => b.times_cooked - a.times_cooked || a.title.localeCompare(b.title), recent:(a, b) => String(b.last_cooked).localeCompare(String(a.last_cooked)), rating:(a, b) => b.rating - a.rating || b.times_cooked - a.times_cooked };
const SORT_OPTS = '<option value="new">Newest</option><option value="az">A–Z</option><option value="made">Most made</option><option value="recent">Recently made</option><option value="rating">Top rated</option>';
function matchesSearch(r, q) { return !q || q.split(/\s+/).every(w => recipeHay(r).includes(w)); }

/* Page: one category */
function viewCat(v, id) {

function addRecipesToCat(c) {

    foot: `<button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="ar-save">Save</button>` });
  w.querySelector('#ar-q').oninput = e => { const q = e.target.value.toLowerCase(); w.querySelectorAll('#ar-list label').forEach(l => l.style.display = l.dataset.t.includes(q) ? '' : 'none'); };
  w.querySelector('#ar-save').onclick = () => {
    let n = 0;

  };
}

      <div class="card list">${cats.map((c, i) => `<div class="lrow" data-open="${esc(c.id)}"><span class="cat-dot" style="background:hsl(${catHue(c)} 45% 55%)"></span><div class="lrow-main"><b>${esc(c.name)}</b><small>${catCount(c)} recipe${catCount(c) === 1 ? '' : 's'}</small></div>
        <div class="lrow-side"><button class="btn sm icon ghost" data-up="${esc(c.id)}" ${i ? '' : 'disabled'} aria-label="Move up">${icon('back','sm').replace('m15 18-6-6 6-6', 'm18 15-6-6-6 6')}</button><button class="btn sm icon ghost" data-dn="${esc(c.id)}" ${i < cats.length - 1 ? '' : 'disabled'} aria-label="Move down">${icon('back','sm').replace('m15 18-6-6 6-6', 'm6 9 6 6 6-6')}</button><button class="btn sm icon ghost" data-edit="${esc(c.id)}" aria-label="Edit">${icon('edit','sm')}</button></div></div>`).join('')}</div>`).join('')}
    ${!S.categories.length ? `<div class="card empty">${icon('book')}<h3>No categories</h3><p>Add your own, or bring back the starter set.</p><button class="btn pri" onclick="lsDel(seedKey());seedCategories();render()">Add starter categories</button></div>` : ''}</div>`;
  $$('[data-open]', v).forEach(el => el.onclick = e => { if (e.target.closest('button')) return; location.hash = '#cat/' + encodeURIComponent(el.dataset.open); });
  $$('[data-edit]', v).forEach(b => b.onclick = () => editCategory(b.dataset.edit));
  $$('[data-gadd]', v).forEach(b => b.onclick = () => editCategory(null, b.dataset.gadd));
  const move = (id, d) => {
    const c = byId(S.categories, id); const cats = groups.find(([g]) => g === c.group)[1];
    const i = cats.indexOf(c), j = i + d; if (j < 0 || j >= cats.length) return;
    [cats[i], cats[j]] = [cats[j], cats[i]];
    const base = Math.min(...cats.map(x => x.sort));
    const changed = cats.filter((x, k) => { const ns = base + k; if (x.sort !== ns) { x.sort = ns; return true; } return false; });
    saveCats(changed); render();
  };
  $$('[data-up]', v).forEach(b => b.onclick = () => move(b.dataset.up, -1));
  $$('[data-dn]', v).forEach(b => b.onclick = () => move(b.dataset.dn, 1));
  const moveGroup = (gi, d) => {
    const order = groups.slice(); const j = gi + d; if (j < 0 || j >= order.length) return;
    [order[gi], order[j]] = [order[j], order[gi]];
    const changed = [];
    order.forEach(([, cats], k) => cats.forEach((c, i) => { const ns = k * 1000 + i * 10; if (c.sort !== ns) { c.sort = ns; changed.push(c); } }));
    saveCats(changed); render();
  };
  $$('[data-gup]', v).forEach(b => b.onclick = () => moveGroup(+b.dataset.gup, -1));
  $$('[data-gdn]', v).forEach(b => b.onclick = () => moveGroup(+b.dataset.gdn, 1));
  $$('[data-gren]', v).forEach(b => b.onclick = () => {
    const old = b.dataset.gren;
    const w = openSheet({ title:'Rename group', body:`<label class="field"><span>Group name</span><input id="gr-n" value="${esc(old)}" autofocus></label>`, foot:`<button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="gr-s">Save</button>` });
    w.querySelector('#gr-s').onclick = () => {
      const n = w.querySelector('#gr-n').value.trim(); if (!n) return toast('Give it a name');
      const cats = S.categories.filter(c => c.group === old); cats.forEach(c => c.group = n); saveCats(cats); w.close(); render();
    };
  });
}

/* Sort recipes that have no category yet */
function bulkSort() {
  const rs = S.recipes.filter(r => !recipeCats(r).length).sort((a, b) => a.title.localeCompare(b.title));
  if (!rs.length) return toast('Every recipe has a category');
  const picks = Object.fromEntries(rs.map(r => [r.id, new Set(suggestCats(r))]));
  const w = openSheet({ title:'Sort recipes into categories', lg:true, body:`
    <p class="muted" style="margin-bottom:12px;font-size:14px">Suggestions are ticked. Tap to untick, or tap <b>+</b> for more categories.</p><div id="bs"></div>`,
    foot:`<button class="btn ghost" data-close>Cancel</button><button class="btn pri" id="bs-go">Save all</button>` });
  const draw = () => {
    w.querySelector('#bs').innerHTML = rs.map(r => `<div class="bs-row"><b>${esc(r.title)}</b><div class="pick-chips">${Array.from(new Set([...suggestCats(r), ...picks[r.id]])).map(n => `<button type="button" class="pchip ${picks[r.id].has(n) ? 'on' : ''}" data-r="${esc(r.id)}" data-n="${esc(n)}">${picks[r.id].has(n) ? icon('check','sm') : ''}${esc(n)}</button>`).join('')}<button type="button" class="pchip new" data-more="${esc(r.id)}" aria-label="More categories">${icon('plus','sm')}</button></div></div>`).join('');
    w.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { const s = picks[b.dataset.r]; s.has(b.dataset.n) ? s.delete(b.dataset.n) : s.add(b.dataset.n); draw(); });
    w.querySelectorAll('[data-more]').forEach(b => b.onclick = () => {
      const id = b.dataset.more, r = byId(S.recipes, id), sel = new Set(picks[id]);
      const pw = openSheet({ title: r.title, body:'<div id="pk2"></div>', foot:`<button class="btn pri" id="pk2-ok">Done</button>` });
      bindCatPicker(pw.querySelector('#pk2'), sel, suggestCats(r));
      pw.querySelector('#pk2-ok').onclick = () => { picks[id] = sel; pw.close(); draw(); };
    });
  };
  draw();
  w.querySelector('#bs-go').onclick = () => {
    let n = 0; rs.forEach(r => { if (picks[r.id].size && setRecipeCats(r, Array.from(picks[r.id]))) n++; });
    w.close(); render(); toast(n + ' recipe' + (n === 1 ? '' : 's') + ' sorted');
  };
}

function fileToJpeg(file, max, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const dataUrl = c.toDataURL('image/jpeg', q);
      URL.revokeObjectURL(url);
      res({ dataUrl, data: dataUrl.split(',')[1], mediaType:'image/jpeg' });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}

/* ═══════════════════════ Yield ═══════════════════════ */
const YIELD_UNITS = ['servings','people','portions','pieces','cookies','bars','muffins','cupcakes','slices','loaves','dozen','cups','quarts','pints','jars','tacos','sandwiches','burgers','pancakes','pizzas','rolls','balls'];
function yieldParts(s) {
  s = normFrac(String(s || '')).trim().replace(/^(serves|servings|yield|yields|makes|about)[:\s]+/i, '');
  const m = s.match(new RegExp('^(' + NUM + '(?:\\s*(?:-|–|to)\\s*' + NUM + ')?)\\s*(.*)$', 'i'));
  if (!m) return { n:'', unit:s };
  return { n: m[1].replace(/\s*(?:-|to)\s*/i, '–'), unit: m[2].trim() };
}
function yieldText(s, k) {
  const p = yieldParts(s);
  if (!p.n) return p.unit;
  return (k && k !== 1 ? scaleQty(p.n, k) : p.n) + ' ' + (p.unit || 'servings');
}

/* ═══════════════════════ Ingredient grid (Amount | Unit | Ingredient) ═══════════════════════ */
const UNIT_CHOICES = ['cup','tbsp','tsp','oz','fl oz','lb','g','kg','ml','l','pinch','dash','clove','can','package','stick','bunch','slice','sprig','handful','jar','head','stalk','piece','quart','pint','to taste'];

  return u.toLowerCase();
}
function lineToRow(l) {

}

function ingGrid(box, lines) {
  let rows = (lines || []).map(lineToRow);
  if (!rows.length) rows = [{ amount:'', unit:'', item:'' }, { amount:'', unit:'', item:'' }, { amount:'', unit:'', item:'' }];
  let textMode = false;
  const sync = () => {
    if (textMode) return;
    $$('.ig-row', box).forEach((el, i) => {
      if (el.classList.contains('sec')) rows[i] = { section: el.querySelector('.ig-s').value };
      else rows[i] = { amount: el.querySelector('.ig-a').value, unit: el.querySelector('.ig-u').value, item: el.querySelector('.ig-n').value };
    });
  };
  const rowHtml = (r, i) => r.section !== undefined
    ? `<div class="ig-row sec" data-i="${i}"><span class="ig-drag" title="Drag to move" aria-hidden="true">${icon('dots','sm')}</span><input class="ig-s" value="${esc(r.section)}" placeholder="Section heading, e.g. For the sauce" aria-label="Section heading"><button type="button" class="ig-x" aria-label="Remove">${icon('x','sm')}</button></div>`
    : `<div class="ig-row" data-i="${i}"><span class="ig-drag" title="Drag to move" aria-hidden="true">${icon('dots','sm')}</span><input class="ig-a" value="${esc(r.amount)}" placeholder="1 1/2" aria-label="Amount" autocomplete="off"><input class="ig-u" value="${esc(r.unit)}" placeholder="cup" list="unit-list" aria-label="Unit" autocomplete="off"><input class="ig-n" value="${esc(r.item)}" placeholder="flour, sifted" aria-label="Ingredient" autocomplete="off"><button type="button" class="ig-x" aria-label="Remove">${icon('x','sm')}</button></div>`;
  const draw = (focus) => {
    if (textMode) {
      box.innerHTML = `<textarea class="ig-text" rows="10" placeholder="One per line:\n2 cups flour\n1 tsp salt\n## For the sauce\n1 cup cream">${esc(rows.map(r => { const l = rowToLine(r); return !l ? '' : l.section ? '## ' + l.section : l.text; }).filter(Boolean).join('\n'))}</textarea>
        <div class="ig-actions"><button type="button" class="btn sm" data-mode>${icon('sliders','sm')}Back to boxes</button></div>`;
      box.querySelector('[data-mode]').onclick = () => { rows = linesToIngredients(box.querySelector('.ig-text').value.split('\n')).map(lineToRow); textMode = false; draw(); };
      return;
    }
    box.innerHTML = `<div class="ig"><div class="ig-head"><span></span><span>Amount</span><span>Unit</span><span>Ingredient</span><span></span></div>${rows.map(rowHtml).join('')}</div>
      <div class="ig-actions"><button type="button" class="btn sm" data-add>${icon('plus','sm')}Ingredient</button><button type="button" class="btn sm ghost" data-sec>${icon('plus','sm')}Section heading</button><span style="flex:1"></span><button type="button" class="btn sm ghost" data-mode>${icon('text','sm')}Edit as text</button></div>`;
    box.querySelector('[data-add]').onclick = () => { sync(); rows.push({ amount:'', unit:'', item:'' }); draw([rows.length - 1, '.ig-a']); };
    box.querySelector('[data-sec]').onclick = () => { sync(); rows.push({ section:'' }); draw([rows.length - 1, '.ig-s']); };
    box.querySelector('[data-mode]').onclick = () => { sync(); textMode = true; draw(); };
    $$('.ig-x', box).forEach(b => b.onclick = () => { sync(); const i = +b.closest('.ig-row').dataset.i; rows.splice(i, 1); if (!rows.length) rows.push({ amount:'', unit:'', item:'' }); draw(); });
    $$('.ig-row input', box).forEach(inp => {
      inp.onkeydown = e => {
        const row = inp.closest('.ig-row'), i = +row.dataset.i;
        if (e.key === 'Enter') {
          e.preventDefault();
          const next = inp.nextElementSibling;
          if (next && next.tagName === 'INPUT') return next.focus();
          sync();
          if (i === rows.length - 1 || rows[i + 1].section !== undefined) { rows.splice(i + 1, 0, { amount:'', unit:'', item:'' }); draw([i + 1, '.ig-a']); }
          else { const n = $$('.ig-row', box)[i + 1]; (n.querySelector('.ig-a') || n.querySelector('input')).focus(); }
        }
        if (e.key === 'Backspace' && !inp.value && (inp.classList.contains('ig-a') || inp.classList.contains('ig-s'))) {
          sync(); const r = rows[i];
          const empty = r.section !== undefined ? !r.section : !(r.amount || r.unit || r.item);
          if (empty && rows.length > 1) { e.preventDefault(); rows.splice(i, 1); draw(i > 0 ? [i - 1, '.ig-n'] : [0, '.ig-a']); }
        }
      };
      inp.onpaste = e => {
        const t = (e.clipboardData || window.clipboardData).getData('text');
        if (!/\n/.test(t.trim())) return;
        e.preventDefault(); sync();
        const i = +inp.closest('.ig-row').dataset.i;
        const add = linesToIngredients(t.split(/\r?\n/)).map(lineToRow);
        const r = rows[i]; const empty = r.section !== undefined ? !r.section : !(r.amount || r.unit || r.item);
        rows.splice(empty ? i : i + 1, empty ? 1 : 0, ...add);
        draw([Math.min(rows.length - 1, (empty ? i : i + 1) + add.length - 1), '.ig-n']);
        toast(add.length + ' ingredients added');

    });
    // Drag to reorder (works with mouse and touch)
    const grid = box.querySelector('.ig');
    $$('.ig-drag', box).forEach(h => h.onpointerdown = e => {
      e.preventDefault(); sync();
      let from = +h.closest('.ig-row').dataset.i;
      grid.setPointerCapture(e.pointerId);
      grid.classList.add('dragging');
      $$('.ig-row', grid)[from].classList.add('lift');
      grid.onpointermove = ev => {
        const els = $$('.ig-row', grid);
        let to = els.findIndex(el => { const b = el.getBoundingClientRect(); return ev.clientY < b.top + b.height / 2; });
        if (to === -1) to = els.length - 1; else if (to > from) to--;
        if (to !== from && to >= 0) {
          const [m] = rows.splice(from, 1); rows.splice(to, 0, m); from = to;
          grid.querySelectorAll('.ig-row').forEach(x => x.remove());
          grid.insertAdjacentHTML('beforeend', rows.map(rowHtml).join(''));
          $$('.ig-row', grid)[from].classList.add('lift');
        }
      };
      grid.onpointerup = grid.onpointercancel = () => { grid.onpointermove = grid.onpointerup = grid.onpointercancel = null; grid.classList.remove('dragging'); draw(); };
    });
    if (focus) { const el = $$('.ig-row', box)[focus[0]]; const f = el && (el.querySelector(focus[1]) || el.querySelector('input')); if (f) f.focus(); }
  };
  draw();
  return {
    lines: () => { if (textMode) return linesToIngredients(box.querySelector('.ig-text').value.split('\n')); sync(); return rows.map(rowToLine).filter(Boolean); },
    state: () => { sync(); return textMode ? box.querySelector('.ig-text').value : JSON.stringify(rows.map(rowToLine).filter(Boolean).map(l => l.section || l.text)); }
  };
}

function mergeIngredient(src, target) {
  const aliases = new Set(String(target.aliases).split(',').map(s => s.trim()).filter(Boolean));
  aliases.add(src.name); String(src.aliases).split(',').map(s => s.trim()).filter(Boolean).forEach(a => aliases.add(a));
  target.aliases = Array.from(aliases).join(', ');
  if (src.notes && !target.notes.includes(src.notes)) target.notes = [target.notes, src.notes].filter(Boolean).join('\n');
  if (src.substitutions && !target.substitutions.includes(src.substitutions)) target.substitutions = [target.substitutions, src.substitutions].filter(Boolean).join('\n');
  target.updated = nowIso();
  queue('save_ingredients', { items: [Object.assign({}, target)] });
  S.recipes.forEach(r => {
    let hit = false;
    (r.ingredients_data||[]).forEach(l => { if (l.ingredient_id === src.id) { l.ingredient_id = target.id; hit = true; } });
    if (hit) queue('save_recipe', { recipe: Object.assign({}, r) });
  });
  const ops = [];
  S.shopping.forEach(s => { if (s.ingredient_id === src.id) { s.ingredient_id = target.id; s.name = target.name; ops.push({ op:'put', item: Object.assign({}, s) }); } });
  if (ops.length) queue('shop_ops', { ops });
  S.ingredients = S.ingredients.filter(i => i.id !== src.id);
  queue('delete_ingredient', { id: src.id });
}

/* ═══════════════════════ Shopping list ═══════════════════════ */
function mergeQty(a, b) {
  if (!a) return b; if (!b) return a;
  const parts = a.split(' + ');
  const pb = parseLine(b + ' x');
  const nb = qtyNum(pb.qty);
  for (let i = 0; i < parts.length; i++) {
    const pa = parseLine(parts[i] + ' x');
    const na = qtyNum(pa.qty);
    if (na != null && nb != null && pa.unit === pb.unit && !pa.size && !pb.size) {
      const sum = na + nb;
      parts[i] = [fmtNum(sum), pa.unit ? unitLabel(pa.unit, sum) : ''].filter(Boolean).join(' ');
      return parts.join(' + ');
    }
  }
  parts.push(b);
  return parts.join(' + ');
}
/** Adds items to the shopping list, combining with what's already there. */
function addShopItems(items, recipe) {
  const ops = [];
  let maxSort = Math.max(0, ...S.shopping.map(s => s.sort || 0));
  items.forEach(it => {
    const key = it.ingredient_id || ingKey(it.name);
    let ex = S.shopping.find(s => !s.checked && (s.ingredient_id ? s.ingredient_id === it.ingredient_id : ingKey(s.name) === key));
    if (ex) {
      ex.qty = mergeQty(ex.qty, it.qty);
      if (recipe && !ex.recipes.some(x => x.id === recipe.id)) ex.recipes.push({ id: recipe.id, title: recipe.title });
    } else {
      ex = { id: uid('s'), name: it.name, qty: it.qty || '', category: it.category || guessAisle(it.name), ingredient_id: it.ingredient_id || '', recipes: recipe ? [{ id: recipe.id, title: recipe.title }] : [], checked:false, added: nowIso(), sort: ++maxSort };
      S.shopping.push(ex);
    }
    ops.push({ op:'put', item: Object.assign({}, ex) });
  });
  if (ops.length) queue('shop_ops', { ops });
  render();
}

function exportJson() {
  const blob = new Blob([JSON.stringify({ exported: nowIso(), recipes:S.recipes, ingredients:S.ingredients, log:S.log, shopping:S.shopping }, null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cookbook-backup-' + today() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function changeBackend() { if (OUTBOX.length && !await confirmSheet('Changes still waiting', OUTBOX.length + ' change(s) haven\'t reached the Sheet yet and will be lost.', 'Change anyway', true)) return; OUTBOX = []; ls('rb_outbox', OUTBOX); CFG = { url:'', pin:'', demo:false }; saveCfg(); lsDel('rb_cache'); location.hash = ''; showGate(); }
function leaveDemo() { CFG = { url:DEFAULT_URL, pin:'', demo:false }; saveCfg(); lsDel('rb_cache'); location.hash = ''; showGate(); }
async function resetDemo() { if (!await confirmSheet('Reset demo data?', 'Puts the sample recipes back and removes anything you added in demo mode.', 'Reset', true)) return; lsDel('rb_demo_db'); syncNow(); }

/* ═══════════════════════ Gate: connect + PIN ═══════════════════════ */
let pinBuf = '';
function lockApp(wrongPin) {
  toggleMenu(false); closeAllSheets();
  if (CFG.demo) { if (!wrongPin) toast('Demo mode has no PIN'); return; }
  CFG.pin = ''; saveCfg();
  showGate(wrongPin ? 'Your PIN changed — enter the new one.' : '');
}
function showGate(err) {
  $('#app').classList.add('hide');
  $('#gate').classList.remove('hide');
  const c = $('#gate-card');
  if (!CFG.url) {
    c.innerHTML = `<div class="gate-logo">${icon('book')}</div><h1>McAfee Cookbook</h1><p>Paste the web app link from your Recipe Box Google Sheet (Apps Script → Deploy).</p>
      <input id="g-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
      <button class="btn pri" style="width:100%" id="g-next">Continue</button>
      <div class="pin-err" id="g-err">${esc(err || '')}</div>
      <button class="link-btn" id="g-demo">Try it first with sample recipes</button>`;
    $('#g-next').onclick = () => {
      const u = $('#g-url').value.trim();
      if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(u)) { $('#g-err').textContent = 'That should be a script.google.com link ending in /exec.'; return; }
      CFG.url = u; saveCfg(); showGate();
    };
    $('#g-url').onkeydown = e => { if (e.key === 'Enter') $('#g-next').click(); };
    $('#g-demo').onclick = () => { CFG = { url:'', pin:'', demo:true }; saveCfg(); start(); };
    return;
  }
  pinBuf = '';
  c.innerHTML = `<div class="gate-logo">${icon('book')}</div><h1>McAfee Cookbook</h1><p>Enter your PIN${ls('rb_ever') ? '' : '<br><span style="font-size:12.5px;color:#9a9aa1">Setting up for the first time? The 4 digits you pick now become your PIN.</span>'}</p>
    <div class="pin-dots">${[0,1,2,3].map(i => `<div class="pin-dot" id="pd${i}"></div>`).join('')}</div>
    <div class="pin-pad">${['1','2','3','4','5','6','7','8','9'].map(n => `<button class="pin-btn" data-p="${n}">${n}</button>`).join('')}<button class="pin-btn alt" data-p="clear">Clear</button><button class="pin-btn" data-p="0">0</button><button class="pin-btn alt" data-p="back" aria-label="Delete">⌫</button></div>
    <div class="pin-err" id="g-err">${esc(err || '')}</div>
    <button class="link-btn" id="g-demo2">Try it with sample recipes</button>`;
  c.querySelectorAll('[data-p]').forEach(b => b.onclick = () => pinPress(b.dataset.p));
  $('#g-demo2').onclick = () => { CFG = { url:'', pin:'', demo:true }; saveCfg(); start(); };
}
document.addEventListener('keydown', e => { if ($('#gate').classList.contains('hide') || !$('.pin-pad')) return; if (/^\d$/.test(e.key)) pinPress(e.key); else if (e.key === 'Backspace') pinPress('back'); });
async function pinPress(k) {
  if (k === 'clear') pinBuf = ''; else if (k === 'back') pinBuf = pinBuf.slice(0, -1); else if (pinBuf.length < 4) pinBuf += k;
  [0,1,2,3].forEach(i => $('#pd' + i).classList.toggle('on', i < pinBuf.length));
  if (pinBuf.length < 4) return;
  $('#g-err').innerHTML = '<span class="spin" style="width:14px;height:14px"></span>';
  const tryPin = pinBuf;
  try {
    CFG.pin = tryPin;
    const r = await api('ping');
    S.ai = !!r.ai; saveCfg(); ls('rb_ever', 1); start();
    if (r.pinCreated) toast('PIN ' + tryPin + ' saved — use it next time', { ms: 6000 });
  } catch (e) {
    CFG.pin = '';
    pinBuf = ''; [0,1,2,3].forEach(i => $('#pd' + i).classList.remove('on'));
    $('#g-err').textContent = e.code === 'pin' ? 'Wrong PIN' : e.message;
    $('#gate-card').classList.remove('shake'); void $('#gate-card').offsetWidth; $('#gate-card').classList.add('shake');
  }
}

/* ═══════════════════════ Start ═══════════════════════ */
function start() {
  $('#gate').classList.add('hide');
  $('#app').classList.remove('hide');
  hydrateIcons(document);
  showSyncState();
  if (!loadCache()) { $('#view').innerHTML = '<div class="busy-box"><span class="spin"></span>Loading your recipes…</div>'; }
  else render();
  syncNow(true).then(handleShareTarget);
}
function handleShareTarget() {
  const p = new URLSearchParams(location.search);
  const shared = [p.get('url'), p.get('text'), p.get('title')].filter(Boolean).join(' ');
  if (!shared) return;
  history.replaceState(null, '', location.pathname + location.hash);
  const m = shared.match(/https?:\/\/\S+/);
  openAdd(m ? { url: m[0] } : { text: shared });
}
applyTheme();
hydrateIcons(document);
if (CFG.demo || (CFG.url && CFG.pin)) start(); else showGate();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
